<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RideTrainer Cockpit & Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --accent: #22d3ee;
      --accent-glow: rgba(34, 211, 238, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --z1: #94a3b8;
      --z2: #38bdf8;
      --z3: #22c55e;
      --z4: #eab308;
      --z5: #f97316;
      --z6: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    header {
      background: rgba(19, 27, 46, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: #1e293b;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .status-badge.connected { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      background: #0f172a;
      border-bottom: 1px solid var(--card-border);
    }
    .nav-tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .nav-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(34, 211, 238, 0.05);
    }

    .view-container { display: none; padding: 16px; flex-direction: column; gap: 16px; flex: 1; }
    .view-container.active { display: flex; }

    /* Cockpit View */
    .cockpit-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .metric-card.full-width { grid-column: span 2; }
    .metric-title { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
    .metric-val { font-family: 'Chakra Petch', sans-serif; font-size: 2.8rem; font-weight: 700; line-height: 1.1; margin-top: 4px; }
    .metric-unit { font-size: 0.85rem; color: var(--text-muted); margin-left: 4px; font-family: 'Inter', sans-serif; font-weight: 400; }
    .metric-sub { font-size: 0.8rem; color: var(--accent); margin-top: 4px; font-weight: 500; }

    .power-card {
      border: 2px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .power-val { font-size: 4rem; text-align: center; color: var(--text); }
    .power-target { text-align: center; font-size: 1rem; color: var(--text-muted); margin-top: 2px; }

    /* Progress & Interval Banner */
    .interval-banner {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .interval-info { display: flex; flex-direction: column; gap: 2px; }
    .interval-title { font-weight: 600; font-size: 0.95rem; }
    .interval-next { font-size: 0.75rem; color: var(--text-muted); }
    .interval-time { font-family: 'Chakra Petch', sans-serif; font-size: 1.8rem; font-weight: 700; color: var(--accent); }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

    /* Controls */
    .controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: auto; }
    .btn {
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent-glow); }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-secondary { background: #1e293b; color: var(--text); border: 1px solid #334155; }
    .btn-full { grid-column: span 2; }

    /* Workouts Selector */
    .workout-list { display: flex; flex-direction: column; gap: 10px; }
    .workout-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: border 0.2s;
    }
    .workout-card.selected { border-color: var(--accent); background: rgba(34, 211, 238, 0.05); }
    .workout-card-title { font-weight: 600; font-size: 1rem; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .workout-card-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.3; }

    /* Analytics View */
    .analytics-summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .stat-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
    }
    .stat-box-title { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .stat-box-val { font-family: 'Chakra Petch', sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--text); margin-top: 4px; }

    /* Zone Distribution Bars */
    .zone-bars { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .zone-row { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; }
    .zone-label { width: 30px; font-weight: 600; }
    .zone-track { flex: 1; height: 10px; background: #1e293b; border-radius: 999px; overflow: hidden; }
    .zone-fill { height: 100%; border-radius: 999px; width: 0%; transition: width 0.5s; }
    .zone-time { width: 45px; text-align: right; color: var(--text-muted); }

    /* Sessions History */
    .history-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5L9 9l3-3 3 4.5 4 1"/></svg>
      RideTrainer
    </div>
    <div class="status-badge" id="btBadge">
      <div class="status-dot"></div>
      <span id="btStatus">Déconnecté</span>
    </div>
  </header>

  <div class="nav-tabs">
    <div class="nav-tab active" id="nav-cockpit" onclick="switchTab('cockpit')">Cockpit</div>
    <div class="nav-tab" id="nav-workouts" onclick="switchTab('workouts')">Séances</div>
    <div class="nav-tab" id="nav-analytics" onclick="switchTab('analytics')">Analyse</div>
  </div>

  <!-- VUE 1 : COCKPIT -->
  <main class="view-container active" id="view-cockpit">
    <div class="interval-banner">
      <div class="interval-info">
        <div class="interval-title" id="intervalTitle">Échauffement</div>
        <div class="interval-next" id="intervalNext">Suivant : 5m @ 180W</div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="intervalProgress"></div>
        </div>
      </div>
      <div class="interval-time" id="intervalTime">05:00</div>
    </div>

    <div class="cockpit-grid">
      <div class="metric-card full-width power-card">
        <span class="metric-title">Puissance Instantanée</span>
        <div class="power-val" id="valPower">0<span class="metric-unit">W</span></div>
        <div class="power-target" id="valTarget">Cible : 140 W (Mode ERG)</div>
      </div>

      <div class="metric-card">
        <span class="metric-title">Cadence</span>
        <div class="metric-val" id="valCadence">0<span class="metric-unit">RPM</span></div>
        <span class="metric-sub" id="subCadence">Moy : 0 RPM</span>
      </div>

      <div class="metric-card">
        <span class="metric-title">Cardio</span>
        <div class="metric-val" id="valHR">--<span class="metric-unit">BPM</span></div>
        <span class="metric-sub" id="subHR">Max : --</span>
      </div>

      <div class="metric-card">
        <span class="metric-title">Chrono Total</span>
        <div class="metric-val" id="valTotalTime" style="font-size: 2.2rem;">00:00</div>
        <span class="metric-sub" id="subWork">0 kJ</span>
      </div>

      <div class="metric-card">
        <span class="metric-title">Puissance Normalisée (NP)</span>
        <div class="metric-val" id="valNP" style="font-size: 2.2rem;">0<span class="metric-unit">W</span></div>
        <span class="metric-sub" id="valIF">IF : 0.00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-secondary btn-full" id="btnConnect" onclick="toggleConnect()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5M12 2v20M12 2l5 5-5 5M12 12l5 5-5 5"/></svg>
        Connecter Home Trainer FTMS
      </button>
      <button class="btn btn-primary" id="btnStart" onclick="toggleRide()">Démarrer</button>
      <button class="btn btn-secondary" onclick="adjustTarget(5)">+5W</button>
      <button class="btn btn-secondary" onclick="adjustTarget(-5)">-5W</button>
      <button class="btn btn-danger" onclick="stopRide()">Arrêter</button>
    </div>
  </main>
